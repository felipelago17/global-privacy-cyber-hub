site_name: Global Privacy & Cyber Hub
site_description: Curated open resource hub for data privacy, cybersecurity, AI governance, DPIAs and global compliance frameworks
site_url: https://felipelago17.github.io/global-privacy-cyber-hub/
repo_url: https://github.com/felipelago17/global-privacy-cyber-hub
repo_name: felipelago17/global-privacy-cyber-hub
edit_uri: edit/main/
docs_dir: docs
site_dir: site
theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.action.edit
    - toc.integrate
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences
plugins:
  - search
nav:
  - Home: README.md
  - Analyses:
      - GCP DPIA (2026): analyses/gcp-dpia-summary.md
      - EDPB Opinion 28/2024 on AI models: analyses/edpb-ai-models.md
      - Three Layers of Agent Security: analyses/agent-security-three-layers.md
      - Medical AI under the EU AI Act: analyses/medical-ai-act-safeguards.md
      - India DPDP in Practice: analyses/india-dpdp-practice.md
      - Transatlantic transfers after FTC ruling: analyses/transatlantic-transfers-ftc.md
      - IAPP 10 Tips for Global Compliance: analyses/iapp-global-compliance-tips.md
      - The Economist on Black October (Nov 2026): analyses/economist-cyber-disaster-leader-2026.md
      - Export controls × cybersecurity convergence (Aug 2026): analyses/export-controls-cybersecurity-convergence-aug2026.md
      - UAE Cybercrime Law — what counts as an offence: analyses/uae-cybercrime-law-offences.md
      - Brazil — ABToken VASP compliance & cyber guide: analyses/brazil-abtoken-spsav-compliance-cyber-guide.md
  - Resources:
      - Source papers: resources/papers/links.md
      - Summaries: resources/papers/summaries/README.md
      - Frameworks:
          - Index: resources/frameworks/README.md
          - ISO/IEC 27090 AI security: resources/frameworks/iso-27090-ai-security.md
          - ISO/SAE TR 8477 road vehicle cyber V&V: resources/frameworks/iso-sae-tr-8477-cybersecurity-vv.md
          - Breach liability regimes (UAE, DIFC, ADGM, India): resources/frameworks/breach-liability-regimes-uae-difc-adgm-india.md
          - NIST IR 8596 Cyber AI Profile (draft): resources/frameworks/nist-ir-8596-cyber-ai-profile.md
      - Tools: resources/tools/README.md
      - Checklists:
          - Index: resources/checklists/README.md
          - Cloud DPIA: resources/checklists/cloud-dpia-checklist.md
          - AI model lawfulness: resources/checklists/ai-model-lawfulness-checklist.md
          - Agent security: resources/checklists/agent-security-checklist.md
          - DPDP readiness: resources/checklists/dpdp-readiness-checklist.md
          - Global compliance maturity: resources/checklists/global-compliance-maturity.md
  - AI agents:
      - Privacy & cyber risks (overview): ai-agents/index.md
      - Incident catalogue 2025–26: ai-agents/incident-catalogue.md
      - Risk literature: ai-agents/risk-literature.md
      - Regulatory map: ai-agents/regulatory-map.md
  - Case studies:
      - Index: case-studies/README.md
      - Binance hack (Oct 2026): case-studies/binance-2026-hack.md
      - OpenAI / Hugging Face (Jul 2026): case-studies/openai-hugging-face-2026.md
      - EFS blood-plasma freezers (Nov 2026): case-studies/efs-coolworld-refrigeration-2026.md
      - Uber CSO conviction (Sullivan): case-studies/uber-sullivan-ciso-obstruction.md
      - SEC v. SolarWinds and its CISO: case-studies/solarwinds-sec-ciso.md
      - Cyber risk in M&A (Marriott, Yahoo): case-studies/cyber-risk-in-m-and-a-marriott-yahoo.md
      - Breach class actions (Equifax, Capital One, Optus, Medibank): case-studies/data-breach-class-actions-equifax-capital-one-optus-medibank.md
      - Meta EUR 1.2bn transfers fine: case-studies/meta-1-2bn-data-transfers-2023.md
      - Operation Snowball (Nov 2026): case-studies/operation-snowball-ai-agent-2026.md
      - AI-agent identity attacks (BluePhishing, ARTEX): case-studies/ai-agent-identity-attacks-entra-artex-2026.md
  - Daily updates: updates/index.md
  - Connectors: connectors/external-hubs.md
  - Related forks: related-forks.md
  - Contributing: CONTRIBUTING.md
