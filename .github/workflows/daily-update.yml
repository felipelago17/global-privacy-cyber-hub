name: Daily privacy & cyber digest

on:
  schedule:
    - cron: "23 5 * * *"   # 05:23 UTC = 09:23 Gulf Standard Time
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser mkdocs-material

      - name: Fetch updates and build digest
        id: digest
        run: |
          python tools/fetch_updates.py
          f="updates/$(date -u +%Y-%m-%d).md"
          if [ -f "$f" ] && ! git diff --quiet -- "$f" || [ -n "$(git ls-files --others -- "$f")" ]; then
            echo "file=$f" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Email digest
        if: steps.digest.outputs.changed == 'true' && env.MAIL_USERNAME != ''
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Privacy & Cyber digest — ${{ github.event.repository.name }} — $(date -u +%Y-%m-%d)"
          to: ${{ vars.DIGEST_RECIPIENTS || 'fevillasuso@adnoc.ae,felchagas@gmail.com' }}
          from: Global Privacy & Cyber Hub <${{ secrets.MAIL_USERNAME }}>
          html_body: file://${{ steps.digest.outputs.file }}
          convert_markdown: true

      - name: Commit digest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add updates data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily digest $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Stage markdown into docs/
        run: |
          mkdir -p docs
          cp README.md CONTRIBUTING.md related-forks.md docs/
          cp -r analyses resources connectors updates case-studies docs/

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
